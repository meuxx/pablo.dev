[build]
  command   = "pnpm build:all"
  publish   = "out"

[[redirects]]
  from = "https://www.pablo.dev/*"
  to = "https://pablo.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://pablo-dev.netlify.app/*"
  to = "https://pablo.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cv.pablo.dev/*"
  to = "/cv.pdf"
  status = 200
  force = true

[[headers]]
  for = "/opengraph-image"
[headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
[headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/cv.pdf"
[headers.values]
    Content-Disposition = "inline; filename=\"Pablo Maceda CV.pdf\""

[[headers]]
  for = "/*"
[headers.values]
    Content-Security-Policy = "default-src 'self' www.notion.so; connect-src 'self'; font-src 'self'; img-src 'self' data: www.notion.so; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(),  camera=(), geolocation=(), gyroscope=(), magnetometer=(),  microphone=(), midi=(), payment=(), speaker=(), usb=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
